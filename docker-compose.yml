services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sipalu-postgres
    environment:
      POSTGRES_DB: sipalu
      POSTGRES_USER: sipaluadmin
      POSTGRES_PASSWORD: sipalu_local_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipaluadmin -d sipalu"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sipalu-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
